services:
  pawpredict:
    build: .
    container_name: pawpredict
    ports:
      - "8501:8501"
    volumes:
      # Feedback persiste en tu máquina aunque el contenedor se borre
      - ./data:/app/data
      # Montar carpeta entera (evita bug de Windows con archivos individuales)
      - ./.streamlit:/app/.streamlit:ro
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s